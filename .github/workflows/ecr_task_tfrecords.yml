name: AWS ECR Task TFRecords

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

            - name: Docker Build Task
              run: docker build -t task-tfrecords tasks/task-tfrecords/

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838 # v1
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@5a88a04c91d5c6f97aae0d9be790e64d9b1d47b7 # v1

            - name: Docker Tag Task
              run: docker tag task-tfrecords ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com/ml-enabler:task-tfrecords-${GITHUB_SHA}

            - name: Docker Push Task
              run: docker push ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.us-east-1.amazonaws.com/ml-enabler:task-tfrecords-${GITHUB_SHA}

